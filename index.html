<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hushwolf</title>
<meta name="description" content="Hushwolf makes games. GENESIS: Living Worlds is our first.">
<meta name="color-scheme" content="dark">
<style>
  :root{--bg:#050505;--panel:#0d0d0d;--line:#262626;--text:#efe9df;--muted:#a59f96;--red:#e3262c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:760px;margin:0 auto;padding:56px 20px 72px}
  h1{margin:0;font-size:56px;letter-spacing:6px;text-transform:uppercase;line-height:1}
  .tag{margin:10px 0 48px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;font-size:13px}
  .game{display:flex;gap:20px;align-items:flex-start;padding:22px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--red)}
  .game img{width:96px;height:96px;flex:none}
  .game h2{margin:0 0 6px;font-size:22px;letter-spacing:1px}
  .game p{margin:0 0 12px;color:var(--muted)}
  a{color:#ff8a80}
  footer{margin-top:48px;color:var(--muted);font-size:14px}
  @media (max-width:520px){h1{font-size:40px}.game{flex-direction:column}}
</style>
</head>
<body>
<main>
<h1>Hushwolf</h1>
<p class="tag">Games from Sarajevo</p>
<article class="game">
  <img src="genesis/icon.png" alt="GENESIS app icon">
  <div>
    <h2>GENESIS: Living Worlds</h2>
    <p>Start as a single cell. Grow organs on your body, survive endless waves of predators, and pass your DNA to the next generation. Coming to Google Play and the App Store.</p>
    <a href="genesis/privacy.html">Privacy notice</a> · <a href="genesis/terms.html">Terms of use</a> · <a href="genesis/support.html">Support</a>
  </div>
</article>
<footer>Contact: <a href="mailto:armin@tlgmarketing.com">armin@tlgmarketing.com</a></footer>
</main>
</body>
</html>
